services:
  - type: web
    name: haqdar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true
    healthCheckPath: /health